name: Payment Service CI/CD

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  # 1. PR 검증용 Job (배포 X, 테스트 O)
  ci-check:
    if: github.event_name == 'pull_request'
    uses: nhnacademy-be12-high-five/.github/.github/workflows/service-workflow.yml@main
    with:
      project-key: team5-payment-service
      docker-image: fbxogns123/payment-server

      # [수정 1] 컨테이너 기본 이름을 'member-server' (하이픈)로 수정
      container-name: payment-server

      # [수정 2] 다중 인스턴스 옵션 추가 (PR 단계에선 배포 안 하지만 명시)
      is-multi-instance: true

      maven-args: "-B"
      deploy-enabled: false
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      SSH_IP: ${{ secrets.SSH_IP }}
      SSH_ID: ${{ secrets.SSH_ID }}
      SSH_PW: ${{ secrets.SSH_PW }}
      SSH_PORT: ${{ secrets.SSH_PORT }}

  # 2. 실제 배포용 Job (Merge/Push 시 실행)
  cd-deploy:
    if: github.event_name == 'push'
    uses: nhnacademy-be12-high-five/.github/.github/workflows/service-workflow.yml@main
    with:
      project-key: team5-payment-service
      docker-image: fbxogns123/payment-server

      # [수정 1] 실제 docker-compose 서비스명(member-server-1, member-server-2)의 접두사로 수정
      # 기존 member_server (언더바) -> member-server (하이픈)
      container-name: payment-server

      # [수정 2] 인스턴스가 2개이므로 다중 인스턴스 배포 옵션 활성화
      is-multi-instance: true

      maven-args: "-B"
      deploy-enabled: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      SSH_IP: ${{ secrets.SSH_IP }}
      SSH_ID: ${{ secrets.SSH_ID }}
      SSH_PW: ${{ secrets.SSH_PW }}
      SSH_PORT: ${{ secrets.SSH_PORT }}